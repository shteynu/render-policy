name: Bug
description: Something renders wrongly, is over-blocked, or a package does not build. Not for bypasses.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A bypass (script runs, request leaves, forbidden element survives) goes to private vulnerability reporting, not here.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@render-policy/core 0.1.0"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The Markdown or HTML, and the mode and policy overrides.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual DOM
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or runtime
      placeholder: "Chromium 131, jsdom 30, Angular 22"
