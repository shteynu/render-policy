name: Feature or policy knob
description: A capability, adapter or policy option you need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What agent content are you rendering, and what goes wrong today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or policy field you have in mind, if any.
