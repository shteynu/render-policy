name: Release

# On a version tag (git tag v0.1.0 && git push origin v0.1.0):
#   1. runs the checks and builds every package;
#   2. attaches the npm tarballs to a GitHub Release, so the packages can be installed
#      from the release URL without npm;
#   3. publishes to npm with provenance when the NPM_TOKEN secret is set.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check that the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/eslint-plugin packages/react packages/mermaid packages/mcp-app-lint packages/angular; do
            version="$(node -p "require('./$pkg/package.json').version")"
            if [ "$version" != "$tag" ]; then
              echo "$pkg is $version, tag is $tag" >&2
              exit 1
            fi
          done
      - name: Pack tarballs
        run: |
          mkdir -p artifacts
          npm pack -w packages/core -w packages/eslint-plugin -w packages/react -w packages/mermaid -w packages/mcp-app-lint --pack-destination artifacts
          (cd packages/angular/dist && npm pack --pack-destination ../../../artifacts)
          ls -l artifacts
      - name: GitHub release with the tarballs
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public -w packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public -w packages/eslint-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public -w packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public -w packages/mermaid
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public -w packages/mcp-app-lint
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: env.HAS_NPM_TOKEN == 'true'
        run: cd packages/angular/dist && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: env.HAS_NPM_TOKEN != 'true'
        run: echo "NPM_TOKEN is not set; tarballs are on the GitHub release, npm publish skipped."
