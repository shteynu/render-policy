name: Release

# On a version tag (git tag v0.1.0 && git push origin v0.1.0), or a manual
# "Run workflow" with the tag as input (workflow_dispatch):
#   1. runs the checks and builds every package;
#   2. attaches the npm tarballs to a GitHub Release, so the packages can be installed
#      from the release URL without npm;
#   3. publishes to npm through trusted publishing (OIDC, no token secret); npm adds
#      provenance itself. Each package on npmjs.com trusts this repository and this file
#      (`npm trust github <pkg> --repo shteynu/render-policy --file release.yml --allow-publish`),
#      so renaming the file breaks publishing until the trust is updated.
# A dispatch run creates the tag itself, at the checked-out commit, via the release step.
# Only full version tags (v0.1.0) trigger it; the moving major tag of the GitHub Action (v1) does not.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            ref="$INPUT_TAG"
          else
            ref="$GITHUB_REF_NAME"
          fi
          case "$ref" in
            v*) ;;
            *) echo "release tag must start with v (got '$ref')" >&2; exit 1 ;;
          esac
          echo "name=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check that the tag matches the package versions
        run: |
          tag="${{ steps.tag.outputs.version }}"
          for pkg in packages/core packages/eslint-plugin packages/react packages/mermaid packages/a2ui packages/mcp-app-lint packages/angular; do
            version="$(node -p "require('./$pkg/package.json').version")"
            if [ "$version" != "$tag" ]; then
              echo "$pkg is $version, tag is $tag" >&2
              exit 1
            fi
          done
          # The Claude Code plugin carries the same version as the packages.
          plugin="$(node -p "require('./plugins/render-policy/.claude-plugin/plugin.json').version")"
          if [ "$plugin" != "$tag" ]; then
            echo "plugins/render-policy is $plugin, tag is $tag" >&2
            exit 1
          fi
      - name: Pack tarballs
        run: |
          mkdir -p artifacts
          npm pack -w packages/core -w packages/eslint-plugin -w packages/react -w packages/mermaid -w packages/a2ui -w packages/mcp-app-lint --pack-destination artifacts
          (cd packages/angular/dist && npm pack --pack-destination ../../../artifacts)
          ls -l artifacts
      - name: GitHub release with the tarballs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: artifacts/*.tgz
          generate_release_notes: true
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm publish --access public -w packages/core
      - run: npm publish --access public -w packages/eslint-plugin
      - run: npm publish --access public -w packages/react
      - run: npm publish --access public -w packages/mermaid
      - run: npm publish --access public -w packages/mcp-app-lint
      - run: cd packages/angular/dist && npm publish --access public
      # Last on purpose: a package published here for the first time has no trusted publisher yet, so
      # this step fails until it has been published once by hand and trusted (`npm trust github`).
      - run: npm publish --access public -w packages/a2ui
